<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F0EA" />
    <title>NarrAI</title>

    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NarrAI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        background: #F4F0EA;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.2s ease;
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .splash-mark {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        display: block;
      }
      .splash-wordmark {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 1.75rem;
        font-weight: 500;
        color: #1C1917;
        letter-spacing: -0.02em;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-screen { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-brand">
        <img src="/logo-mark.png" alt="" class="splash-mark" />
        <span class="splash-wordmark">NarrAI</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
