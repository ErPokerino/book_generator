api_timeouts:
  submit_form: 30000
  generate_questions: 60000
  submit_answers: 30000
  generate_draft: 120000
  generate_outline: 120000
  download_pdf: 300000
retry:
  chapter_generation:
    max_retries: 2
    min_chapter_length: 1200
  manga_generation:
    max_retries: 2
    page_retry_delay_seconds: 3
  structured_output:
    max_retries: 2
    repair_attempts: 1
    base_delay_seconds: 2
  questions_generation:
    max_retries: 2
  draft_generation:
    max_retries: 2
  outline_generation:
    max_retries: 2
validation:
  min_chapter_length: 1200
  min_chapter_words: 180
  disallowed_output_markers:
    - "[ERRORE:"
    - "[ERROR:"
  words_per_page: 250
  toc_chapters_per_page: 30
frontend:
  polling_interval: 2000
  polling_interval_critique: 5000
  polling_interval_questions: 1500
  polling_interval_draft: 3000
  polling_interval_outline: 2500
  polling_backoff_max: 15000
time_estimation:
  min_chapters_for_reliable_avg: 3
  use_session_avg_if_available: true
  fallback_seconds_per_chapter: 45
  fallback_by_model:
    gemini-3.8-flash: 40
    gemini-3.5-flash-lite: 28
    gemini-3-flash: 35
    gemini-3-flash-preview: 35
    gemini-3-pro: 50
    gemini-3.1-pro-preview: 50
    gemini-3-ultra: 100
    gemini-2.5-flash: 35
    gemini-2.5-pro: 50
    default: 45
  linear_model_params:
    standard:
      a: 0.1584
      b: 25.85
    flash:
      a: 0.1584
      b: 25.85
    pro:
      a: 0.2958
      b: 54.01
    ultra:
      a: 0.5682
      b: 90.43
    default:
      a: 1.1
      b: 44.3
llm_models:
  defaults:
    text: gemini-3.8-flash
    image: gemini-3.1-flash-lite-image
    cover_image: gemini-3.1-flash-image
    tts: gemini-3.1-flash-tts-preview
  catalog:
    gemini-3.8-flash:
      api_id: gemini-3.8-flash
      purpose: text
      label: Gemini 3.8 Flash
      description: Qualità alta per capitoli, bozza e struttura
      mode: standard
      temperature: 1.0
    gemini-3.5-flash-lite:
      api_id: gemini-3.5-flash-lite
      purpose: text
      label: Gemini 3.5 Flash Lite
      description: Più veloce, ideale per domande e prove
      mode: standard
      temperature: 1.0
    gemini-3.1-flash-lite-image:
      api_id: gemini-3.1-flash-lite-image
      purpose: image
      label: Gemini 3.1 Flash Lite Image
      description: Pagine interne e prove visive
    gemini-3.1-flash-image:
      api_id: gemini-3.1-flash-image
      purpose: image
      label: Gemini 3.1 Flash Image
      description: Copertine e tavole più dettagliate
    gemini-3.1-flash-tts-preview:
      api_id: gemini-3.1-flash-tts-preview
      purpose: tts
      label: Gemini 3.1 Flash TTS
    gemini-3-flash:
      api_id: gemini-3.8-flash
      purpose: text
      mode: standard
    gemini-3-flash-preview:
      api_id: gemini-3.8-flash
      purpose: text
      mode: standard
    gemini-3-pro:
      api_id: gemini-3.8-flash
      purpose: text
      mode: standard
    gemini-3.1-pro-preview:
      api_id: gemini-3.8-flash
      purpose: text
      mode: standard
    gemini-3-ultra:
      api_id: gemini-3.8-flash
      purpose: text
      mode: ultra
    gemini-2.5-flash:
      api_id: gemini-3.5-flash-lite
      purpose: text
      mode: standard
    gemini-2.5-pro:
      api_id: gemini-3.8-flash
      purpose: text
      mode: standard
    gemini-3.1-flash-image-preview:
      api_id: gemini-3.1-flash-image
      purpose: image
  stage_model_overrides:
    questions: gemini-3.5-flash-lite
    draft: gemini-3.8-flash
    outline: gemini-3.8-flash
    chapters: gemini-3.8-flash
    critique: gemini-3.8-flash
    cover: gemini-3.1-flash-image
    manga_planning: gemini-3.8-flash
    manga_pages: gemini-3.1-flash-lite-image
    manga_cover: gemini-3.1-flash-image
    manga_back_cover: gemini-3.1-flash-image
    tts: gemini-3.1-flash-tts-preview
  structured_output_method: json_schema
  max_output_tokens:
    gemini_2_5_flash: 8192
    lite: 8192
    default: 65536
google_llm:
  provider: developer_api
llm_tracing:
  enabled: true
  sample_rate: 1.0
  schema_version: 2
  preview_char_limit: 0
  record_message_previews: false
  record_response_previews: false
  redact_text: true
  export_target: jsonl
cover_generation:
  aspect_ratio: '2:3'
  image_model: gemini-3.1-flash-image
manga_generation:
  page_count: 10
  min_page_count: 10
  max_page_count: 100
  image_model: gemini-3.1-flash-lite-image
  cover_image_model: gemini-3.1-flash-image
  aspect_ratio: '3:4'
  max_reference_images: 2
temperature:
  default: 1.0
cost_estimation:
  tokens_per_page: 350
  currency: EUR
  exchange_rate_usd_to_eur: 0.92
  model_costs:
    gemini-3.8-flash:
      input_cost_per_million: 0.75
      output_cost_per_million: 3.75
    gemini-3.5-flash-lite:
      input_cost_per_million: 0.3
      output_cost_per_million: 2.5
    gemini-2.5-flash:
      input_cost_per_million: 0.3
      output_cost_per_million: 2.5
    gemini-2.5-pro:
      input_cost_per_million: 1.25
      output_cost_per_million: 10.0
    gemini-3-flash-preview:
      input_cost_per_million: 0.5
      output_cost_per_million: 3.0
    gemini-3.1-pro-preview:
      input_cost_per_million: 2.0
      output_cost_per_million: 12.0
    gemini-3-ultra:
      input_cost_per_million: 0.5
      output_cost_per_million: 3.0
    default:
      input_cost_per_million: 0.5
      output_cost_per_million: 3.0
  image_generation_cost: 0.1008
  manga_image_generation_cost: 0.0336
  preview:
    manga_pages: 10
    questions_seconds: 8
    draft_seconds: 20
    outline_seconds: 18
    critique_seconds: 40
    cover_seconds: 25
    manga_planning_seconds: 20
    manga_page_seconds: 12
    manga_cover_seconds: 20
  token_estimates:
    draft:
      input_base: 800
      output_per_page: 12
    outline:
      input_base: 3000
      output_base: 2000
    chapter:
      context_base: 8000
      writer_prompt_tokens: 2800
      story_bible_tokens: 3400
      recent_full_chapters: 1
    critique:
      input_multiplier: 1.2
      output_base: 1200
